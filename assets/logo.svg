<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Monogram Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Monogram Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Node Glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Emblem Shield -->
  <polygon points="60,6 106,32 106,88 60,114 14,88 14,32"
           fill="url(#bgGrad)"
           stroke="url(#rimGrad)"
           stroke-width="3"
           stroke-linejoin="round"
           filter="url(#neonGlow)" />

  <!-- Inner Concentric Wireframe Accent -->
  <polygon points="60,14 98,36 98,84 60,106 22,84 22,36"
           fill="none"
           stroke="rgba(0, 240, 255, 0.18)"
           stroke-width="1.2"
           stroke-dasharray="4,3"
           stroke-linejoin="round" />

  <!-- Spatial CV Tracking Coordinates Grid Lines -->
  <line x1="60" y1="14" x2="60" y2="28" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="92" x2="60" y2="106" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="22" y1="60" x2="36" y2="60" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="84" y1="60" x2="98" y2="60" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-linecap="round" />

  <!-- ST Monogram Geometry -->
  <!-- 'T' Horizontal Bar -->
  <path d="M 34 36 L 86 36 L 82 43 L 38 43 Z"
        fill="url(#cyanGrad)"
        filter="url(#neonGlow)" />

  <!-- 'T' Center Pillar (Vertical Stem) -->
  <path d="M 57 43 L 63 43 L 63 86 L 57 86 Z"
        fill="url(#cyanGrad)"
        opacity="0.85" />

  <!-- Futuristic Cybernetic 'S' Ribbon Sweeping Through 'T' -->
  <!-- Upper Curve of 'S' -->
  <path d="M 76 43 L 84 43 C 84 56 68 56 60 59 C 48 63 40 67 40 76 C 40 86 52 89 68 88 L 74 88 L 72 82 L 67 82 C 55 83 47 80 47 75 C 47 69 56 66 65 63 C 78 59 86 55 86 43 Z"
        fill="url(#purpleGrad)"
        filter="url(#neonGlow)" />
  
  <!-- Upper Left Wing of 'S' -->
  <path d="M 36 50 C 36 43 44 41 53 41 L 53 47 C 46 47 43 49 43 52 C 43 56 48 58 56 60 L 53 66 C 42 63 36 58 36 50 Z"
        fill="url(#cyanGrad)" />

  <!-- Spatial Landmark Sensor Nodes (MediaPipe / MoCap Homage) -->
  <circle cx="60" cy="6" r="3" fill="#00f0ff" filter="url(#nodeGlow)" />
  <circle cx="106" cy="32" r="3" fill="#8b5cf6" filter="url(#nodeGlow)" />
  <circle cx="106" cy="88" r="3" fill="#00f0ff" filter="url(#nodeGlow)" />
  <circle cx="60" cy="114" r="3" fill="#8b5cf6" filter="url(#nodeGlow)" />
  <circle cx="14" cy="88" r="3" fill="#00f0ff" filter="url(#nodeGlow)" />
  <circle cx="14" cy="32" r="3" fill="#8b5cf6" filter="url(#nodeGlow)" />

  <!-- Center Core Energy Node -->
  <circle cx="60" cy="60" r="3.5" fill="#00f0ff" filter="url(#nodeGlow)" />
  <circle cx="60" cy="60" r="1.5" fill="#ffffff" />
</svg>
